  <path d="M60 144C58 124 72 114 96 116L98 134C84 132 70 136 60 144Z" fill="#0F3A8C"/>
  <path d="M180 144C182 124 168 114 144 116L142 134C156 132 170 136 180 144Z" fill="#0F3A8C"/>
  <path d="M66 132L90 124M174 132L150 124" stroke="#2FD2D6" stroke-width="2"/>
  <!-- crossed forearms: back one runs up to the right, its fingers wrap the right bicep -->
  <path d="M74 186L160 168" stroke="#0A1B44" stroke-width="26"/>
  <path d="M74 186L160 168" stroke="#123C8F" stroke-width="21"/>
