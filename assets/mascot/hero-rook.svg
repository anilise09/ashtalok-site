  <path d="M166 162V177M171 163V176" stroke="#8E5A3E" stroke-width="1.6"/>
  <!-- front one runs up to the left, its fist rests on the left bicep -->
  <path d="M166 186L82 164" stroke="#0A1B44" stroke-width="26"/>
  <path d="M166 186L82 164" stroke="#1D52B8" stroke-width="21"/>
  <path d="M96 156L91 176" stroke="#2FD2D6" stroke-width="3.5"/>
  <path d="M88 154C80 150 68 152 66 162C64 172 74 176 82 175L90 174Z" fill="#C68A64"/>
  <path d="M71 160H80M70 166H80" stroke="#8E5A3E" stroke-width="1.6"/>
