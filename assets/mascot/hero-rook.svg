  <path d="M120 206L124 256Q132 257 140 257L128 206Z" fill="#123C8F" stroke="none"/>
  <path d="M116 256L120 206L124 256" fill="none" stroke="#2FD2D6" stroke-width="2"/>
  <!-- belt -->
  <path d="M68 194Q120 201 172 194L173 207Q120 214 67 207Z" fill="#0B2A33"/>
  <g transform="translate(120 202)" stroke="none" fill="#2FD2D6"><rect x="-8" y="-5.5" width="7.5" height="5" rx="1.2"/><rect x="0.5" y="-5.5" width="7.5" height="5" rx="1.2"/><rect x="-8" y="0.5" width="3.5" height="5" rx="1.2"/><rect x="-3.5" y="0.5" width="7" height="5" rx="1.2"/><rect x="4.5" y="0.5" width="3.5" height="5" rx="1.2"/></g>
  <!-- lapel V showing the undershirt -->
  <path d="M106 118L120 148L134 118Z" fill="#0B2A33"/>
  <path d="M106 118L120 148L134 118" fill="none" stroke="#2FD2D6" stroke-width="2"/>
