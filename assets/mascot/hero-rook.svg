  <path d="M89 62Q120 55 151 62L149 77Q120 84 91 77Z" fill="#0B2A33"/>
  <path d="M96 66Q120 61 144 66L143 72Q120 77 97 72Z" fill="#2FD2D6" stroke="none"/>
  <path d="M100 66.5Q108 64.5 116 64" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"/>
  <rect x="85" y="64" width="8" height="13" rx="3" fill="#1747A6"/>
  <rect x="147" y="64" width="8" height="13" rx="3" fill="#1747A6"/>
  <circle cx="89" cy="70.5" r="1.8" fill="#2FD2D6" stroke="none"/>
  <circle cx="151" cy="70.5" r="1.8" fill="#2FD2D6" stroke="none"/>
  <!-- brows -->
  <path d="M102 56L113 54M127 54L138 55" stroke="#14213D" stroke-width="3.2"/>
  <!-- nose + smirk -->
  <path d="M121 79Q124 84 119 85" fill="none" stroke="#A96E4E" stroke-width="2"/>
  <path d="M112 90Q121 93 130 88" fill="none" stroke="#5B2E22" stroke-width="2.6"/>
