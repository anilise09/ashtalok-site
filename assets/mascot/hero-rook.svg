<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" aria-hidden="true" focusable="false">
<!-- Rook: the wall-warden in a long structured coat with a brick stand-collar and a teal visor. Arms crossed. -->
