  <clipPath id="rk-collar-clip"><path d="M94 98H146L152 122Q120 130 88 122Z"/></clipPath>
</defs>
<g stroke="#0A1B44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
