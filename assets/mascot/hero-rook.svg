  <path d="M94 68C90 50 94 36 104 30C112 20 138 12 160 24C152 25 148 28 150 34C154 44 152 54 150 62L146 58C146 50 140 46 132 46H112C104 47 99 54 98 68Z" fill="#14213D"/>
